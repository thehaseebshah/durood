# One small machine and one disk (the database is a single SQLite file). Change `app` to a name that is free on Fly.
app = "tasbeeh-simple"
primary_region = "sin"

[build]

[env]
  PORT = "8080"
  DB_PATH = "/data/tasbeeh.db"

[mounts]
  source = "tasbeeh_data"
  destination = "/data"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = "off"
  auto_start_machines = true
  min_machines_running = 1

  [[http_service.checks]]
    method = "GET"
    path = "/healthz"
    interval = "30s"
    timeout = "5s"
    grace_period = "10s"

[[vm]]
  size = "shared-cpu-1x"
  memory = "256mb"
