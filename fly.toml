# Fly.io: one machine in Singapore with a persistent volume. Change `app` to your own unique name.
# The app keeps its scheduler (reminders, backups, photo clean-up) in the process and its database on one disk,
# so it must stay a single, always-running machine.
app = "seerah-quest-qa"
primary_region = "sin"

[build]

swap_size_mb = 512   # headroom for the nightly audit and housekeeping on a 256 MB machine

[env]
  PORT = "8080"
  NODE_ENV = "production"
  DB_PATH = "/data/durood.db"
  UPLOAD_DIR = "/data/uploads"
  BACKUP_DIR = "/data/backups"
  PUBLIC_URL = "https://seerah-quest-qa.fly.dev"
  TRUST_PROXY = "1"
  CLIENT_IP_HEADER = "fly-client-ip"
  EDITION = "internal"
  FORCE_HSTS = "1"

[mounts]
  source = "quest_data"
  destination = "/data"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = "off"
  auto_start_machines = true
  min_machines_running = 1

  [http_service.concurrency]
    type = "requests"
    soft_limit = 200
    hard_limit = 400

[[http_service.checks]]
  method = "GET"
  path = "/healthz"
  interval = "30s"
  timeout = "5s"
  grace_period = "10s"

[[vm]]
  size = "shared-cpu-1x"
  memory = "256mb"
