name: tests
on:
  push:
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - run: npm test
      # the same tests with the clock just after Pakistan midnight into a Monday, at the end of a day, and at New Year
      - run: npm run test:dates
      # malformed input on every API route: no route may answer 5xx
      - run: npm run fuzz
      # 60 members at once, then the ledger audit must be clean
      - run: npm run stress
  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      # Playwright is only needed here, so it is installed for the run and never added to the app's dependencies
      - run: npm install --no-save playwright@1.48.2 axe-core@4.10.2 && npx playwright install --with-deps chromium
      - run: npm run e2e
