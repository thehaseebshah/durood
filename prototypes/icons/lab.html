<!doctype html><html><head><meta charset="utf-8"><title>Icon styles</title>
<style>
*{box-sizing:border-box;margin:0}body{font:13px Inter,system-ui,sans-serif;background:#888;padding:14px;width:900px}
h1{font:700 20px Inter,system-ui;color:#fff;margin-bottom:2px}p.d{color:#eee;margin-bottom:10px;max-width:820px}
.pair{display:flex;gap:14px}.panel{width:436px;padding:14px;background:var(--paper);color:var(--ink)}
.panel h4{font:700 11px Inter;letter-spacing:1.2px;text-transform:uppercase;margin:0 0 8px;color:var(--soft)}
.ui{display:grid;grid-template-columns:repeat(8,1fr);gap:10px 4px;margin-bottom:14px}.ui div{text-align:center;font-size:9px;color:var(--soft)}.ui svg{display:block;margin:0 auto 3px}
.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:10px 6px}.grid div{text-align:center;font-size:10px;line-height:1.2;color:var(--soft)}.grid svg{display:block;margin:0 auto 4px}
.light{--paper:#fff;--ink:#0b0b0b;--soft:#66665f;--sig:#00a86b;--on:#06180f;--track:#ecece6;--tint:#bdeedb;--line:#a8a8a0}
.dark{--paper:#0b0b0b;--ink:#f4f1ea;--soft:#92928b;--sig:#22d68f;--on:#04170f;--track:#1c1c1a;--tint:#14503a;--line:#4a4a45}
</style></head><body>
<h1 id="t"></h1><p class="d" id="d"></p><div class="pair" id="out"></div>
<script>
const STYLE = new URLSearchParams(location.search).get('s') || 'mono';
// 24x24 glyph drawings; FILL marks the shapes a style may fill
const G = {
 beads:'<path fill="none" d="M3 8Q12 22 21 8"/><circle fill="FILL" cx="4.5" cy="9" r="1.8"/><circle fill="FILL" cx="8" cy="14" r="1.8"/><circle fill="FILL" cx="12" cy="16" r="1.8"/><circle fill="FILL" cx="16" cy="14" r="1.8"/><circle fill="FILL" cx="19.5" cy="9" r="1.8"/>',
 flame:'<path fill="FILL" d="M12 3c1 4 5 5 5 10a5 5 0 0 1-10 0c0-2 1-3 2-4 0 2 1 3 2 3 0-3-1-5 1-9z"/>',
 shield:'<path fill="FILL" d="M12 3l7 3v6c0 4-3 7-7 9-4-2-7-5-7-9V6z"/>',
 leaf:'<path fill="FILL" d="M5 19C5 9 11 5 19 5c0 8-4 14-14 14z"/><path fill="none" d="M5 19l8-8"/>',
 lens:'<circle fill="FILL" cx="10.5" cy="10.5" r="6"/><path fill="none" d="M15 15l5 5"/>',
 book:'<path fill="FILL" d="M4 5h7a1.5 1.5 0 0 1 1 .5A1.5 1.5 0 0 1 13 5h7v14h-7a1.5 1.5 0 0 0-1 .5 1.5 1.5 0 0 0-1-.5H4z"/><path fill="none" d="M12 5.5v14"/>',
 nodes:'<path fill="none" d="M12 7l-6 10M12 7l6 10M6 17h12"/><circle fill="FILL" cx="12" cy="6" r="2.4"/><circle fill="FILL" cx="5.5" cy="17.5" r="2.4"/><circle fill="FILL" cx="18.5" cy="17.5" r="2.4"/>',
 seat:'<circle fill="FILL" cx="12" cy="12" r="3"/><circle fill="FILL" cx="20" cy="12" r="1.5"/><circle fill="FILL" cx="16" cy="18.9" r="1.5"/><circle fill="FILL" cx="8" cy="18.9" r="1.5"/><circle fill="FILL" cx="4" cy="12" r="1.5"/><circle fill="FILL" cx="8" cy="5.1" r="1.5"/><circle fill="FILL" cx="16" cy="5.1" r="1.5"/>',
 chain:'<rect fill="FILL" x="2" y="8.5" width="12" height="7" rx="3.5"/><rect fill="FILL" x="10" y="8.5" width="12" height="7" rx="3.5"/>',
 star:'<rect fill="FILL" x="5.5" y="5.5" width="13" height="13"/><rect fill="FILL" x="5.5" y="5.5" width="13" height="13" transform="rotate(45 12 12)"/>',
 home:'<path fill="FILL" d="M4 11l8-7 8 7v9h-5v-6H9v6H4z"/>',
 bars:'<rect fill="FILL" x="3.5" y="10" width="4" height="10"/><rect fill="FILL" x="10" y="4" width="4" height="16"/><rect fill="FILL" x="16.5" y="13" width="4" height="7"/>',
 caravan:'<path fill="none" d="M8 13l2.5-3M15.5 10l2.5 3M8.5 19.5h7"/><circle fill="FILL" cx="5.5" cy="14" r="2.6"/><circle fill="FILL" cx="12" cy="8" r="2.6"/><circle fill="FILL" cx="18.5" cy="14" r="2.6"/>',
 me:'<circle fill="FILL" cx="12" cy="8" r="3.6"/><path fill="none" d="M5 20c1-4 4-6 7-6s6 2 7 6"/>',
 tap:'<circle fill="FILL" cx="12" cy="12" r="3"/><circle fill="none" cx="12" cy="12" r="7.5"/>',
 play:'<rect fill="FILL" x="3" y="5" width="18" height="14"/><path fill="none" d="M10 9.5l5 2.5-5 2.5z"/>',
 check:'<path fill="none" d="M5 12.5l4.5 4.5L19 7"/>',
 camera:'<rect fill="FILL" x="3" y="7" width="18" height="12"/><circle fill="none" cx="12" cy="13" r="3.2"/><path fill="none" d="M8.5 7l1.2-2h4.6l1.2 2"/>',
 share:'<path fill="none" d="M5 12v7h14v-7M12 4v10M8 8l4-4 4 4"/>',
 bolt:'<path fill="FILL" d="M13 2L4 14h7l-1 8 9-12h-7z"/>',
};
const UI = [['home','Home'],['bars','Ranks'],['caravan','Caravan'],['star','Bonus'],['me','Me'],['tap','Recite'],['flame','Streak'],['shield','Shield'],['leaf','Sunnah'],['book','Seerah'],['play','Lecture'],['check','Done'],['camera','Photo'],['share','Invite'],['bolt','XP'],['lens','Review']];
// badge code -> [glyph, label, tier, maxTier, name]
const B = {
 first_step:['beads','1',1,5,'First Step'], d1k:['beads','1K',2,5,'1,000'], d10k:['beads','10K',3,5,'10,000'], d100k:['beads','100K',4,5,'100,000'], d1m:['beads','1M',5,5,'1 Million'],
 streak7:['flame','7D',1,3,'7-Day Streak'], streak30:['flame','30D',2,3,'30-Day Streak'], streak100:['flame','100D',3,3,'100-Day Streak'],
 sunnah1:['leaf','S1',1,3,'Sunnah Keeper'], sunnah7:['leaf','S7',2,3,'Sunnah Seven'], sunnah30:['leaf','S30',3,3,'Sunnah Thirty'],
 verifier10:['lens','R10',1,2,'Trusted Reviewer'], verifier100:['lens','R100',2,2,'Pillar of Trust'],
 recruit1:['nodes','+1',1,3,'Caller'], recruit5:['nodes','+5',2,3,'Guide'], recruit25:['nodes','+25',3,3,'Caravan Leader'],
 scholar1:['book','L1',1,2,'Student'], scholar10:['book','L10',2,2,'Scholar'], circle:['seat','SC',1,1,'Circle Member'],
 caravan10k:['chain','C10K',1,4,'Caravan 10K'], caravan100k:['chain','C100K',2,4,'Caravan 100K'], caravan1m:['chain','C1M',3,4,'Caravan 1M'], caravan10m:['chain','C10M',4,4,'Caravan 10M'],
};
const EARNED = new Set(['first_step','d1k','d10k','streak7','sunnah1','recruit1','scholar1']);
const SOLID = new Set(['flame','shield','leaf','star','home','bars','bolt','nodes','caravan','me','beads','seat','chain']);
const gl = (name, fill) => G[name].replaceAll('FILL', fill);
const star8 = (cx, cy, s, attrs) => `<rect x="${cx-s/2}" y="${cy-s/2}" width="${s}" height="${s}" ${attrs}/><rect x="${cx-s/2}" y="${cy-s/2}" width="${s}" height="${s}" transform="rotate(45 ${cx} ${cy})" ${attrs}/>`;
const place = (name, cx, cy, size, stroke, fill, extra = '') => `<g transform="translate(${cx-size/2} ${cy-size/2}) scale(${size/24})" fill="none" stroke-width="${stroke*24/size}" stroke-linecap="round" stroke-linejoin="round" ${extra}>${gl(name, fill)}</g>`;
const dots = (n, max, cx, y, r, on, off, gap = 9) => [...Array(max)].map((_, i) => `<circle cx="${cx + (i - (max - 1) / 2) * gap}" cy="${y}" r="${r}" fill="${i < n ? on : 'none'}" stroke="${i < n ? on : off}" stroke-width="1"/>`).join('');

// ---- four styles -----------------------------------------------------------------------
const S = {
 mono: {
  title: '1 · Monoline', desc: 'Thin 1.6px line pictograms, no fills. Tier shows as dots under the icon. Lightest and most Swiss; locked badges simply fade.',
  ui: (n, sz) => `<svg width="${sz}" height="${sz}" viewBox="0 0 24 24" stroke="var(--ink)" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">${gl(n, 'none')}</svg>`,
  badge: (c, on) => { const [g, , t, m] = B[c]; return `<svg width="76" height="76" viewBox="0 0 76 76">${place(g, 38, 32, 40, 1.7, 'none', `stroke="${on ? 'var(--ink)' : 'var(--line)'}" opacity="${on ? 1 : .55}"`)}${dots(t, m, 38, 62, 2.6, on ? 'var(--sig)' : 'var(--line)', 'var(--line)', 9)}</svg>`; },
 },
 tile: {
  title: '2 · Solid Tile', desc: 'A square signage tile: green when earned, grey when locked, with a bold glyph, the code underneath and tier bars along the top. Like transport pictograms.',
  ui: (n, sz) => `<svg width="${sz}" height="${sz}" viewBox="0 0 24 24" stroke="var(--ink)" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round">${gl(n, SOLID.has(n) ? 'var(--ink)' : 'none')}</svg>`,
  badge: (c, on) => { const [g, lab, t, m] = B[c]; const bg = on ? 'var(--sig)' : 'var(--track)', fg = on ? 'var(--on)' : 'var(--line)';
   return `<svg width="76" height="76" viewBox="0 0 76 76"><rect x="4" y="4" width="68" height="68" fill="${bg}"/>${[...Array(m)].map((_, i) => `<rect x="${10 + i * (56 / m)}" y="9" width="${56 / m - 3}" height="4" fill="${i < t ? fg : 'none'}" stroke="${fg}" stroke-width="1"/>`).join('')}${place(g, 38, 36, 30, 2.4, SOLID.has(g) ? fg : 'none', `stroke="${fg}"`)}<text x="38" y="63" text-anchor="middle" font-family="Inter,system-ui" font-weight="800" font-size="12" letter-spacing="-.3" fill="${fg}">${lab}</text></svg>`; },
 },
 star: {
  title: '3 · Star Frame', desc: 'Every badge sits in the app’s eight-point star. Tier adds geometry around it: an inner star, a ring, a second ring, then a ring of dots. Earned badges fill green.',
  ui: (n, sz) => `<svg width="${sz}" height="${sz}" viewBox="0 0 24 24"><g stroke="var(--line)" stroke-width=".7" fill="none">${star8(12, 12, 20, '')}</g><g stroke="var(--ink)" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" transform="translate(4.2 4.2) scale(.65)">${gl(n, 'none')}</g></svg>`,
  badge: (c, on) => { const [g, , t] = B[c]; const ink = on ? 'var(--ink)' : 'var(--line)';
   let rings = '';
   if (t >= 2) rings += `<g fill="none" stroke="${ink}" stroke-width="1">${star8(38, 38, 38, '')}</g>`;
   if (t >= 3) rings += `<circle cx="38" cy="38" r="33" fill="none" stroke="${ink}" stroke-width="1"/>`;
   if (t >= 4) rings += `<circle cx="38" cy="38" r="36.5" fill="none" stroke="${ink}" stroke-width="1"/>`;
   if (t >= 5) rings += [...Array(8)].map((_, i) => `<circle cx="${38 + 36.5 * Math.cos(i * Math.PI / 4)}" cy="${38 + 36.5 * Math.sin(i * Math.PI / 4)}" r="2" fill="var(--sig)"/>`).join('');
   return `<svg width="76" height="76" viewBox="0 0 76 76">${rings}<g fill="${on ? 'var(--sig)' : 'none'}" stroke="${ink}" stroke-width="1.5">${star8(38, 38, 40, '')}</g>${place(g, 38, 38, 27, 1.9, 'none', `stroke="${on ? 'var(--on)' : 'var(--line)'}"`)}</svg>`; },
 },
 duo: {
  title: '4 · Offset Duotone', desc: 'A bold outlined tile with a hard offset shadow, a pale green wash and a filled glyph. Chunkier and more playful, still flat and square. Tier shows as small squares.',
  ui: (n, sz) => `<svg width="${sz}" height="${sz}" viewBox="0 0 24 24" stroke-linecap="round" stroke-linejoin="round"><g transform="translate(1.2 1.2)" stroke="var(--sig)" stroke-width="2" fill="var(--sig)">${gl(n, 'var(--sig)')}</g><g stroke="var(--ink)" stroke-width="1.8" fill="none">${gl(n, 'var(--tint)')}</g></svg>`,
  badge: (c, on) => { const [g, , t, m] = B[c]; const ink = on ? 'var(--ink)' : 'var(--line)';
   return `<svg width="76" height="76" viewBox="0 0 76 76"><rect x="11" y="11" width="58" height="58" fill="${on ? 'var(--sig)' : 'var(--track)'}"/><rect x="6" y="6" width="58" height="58" fill="${on ? 'var(--tint)' : 'var(--paper)'}" stroke="${ink}" stroke-width="2.4"/>${place(g, 35, 33, 32, 2, on ? 'var(--sig)' : 'none', `stroke="${ink}"`)}${[...Array(m)].map((_, i) => `<rect x="${12 + i * 8}" y="53" width="5" height="5" fill="${i < t ? ink : 'none'}" stroke="${ink}" stroke-width="1"/>`).join('')}</svg>`; },
 },
};
const s = S[STYLE];
document.getElementById('t').textContent = s.title; document.getElementById('d').textContent = s.desc;
const panel = (mode) => `<div class="panel ${mode}"><h4>${mode === 'light' ? 'White' : 'Dark'} · UI icons</h4><div class="ui">${UI.map(([n, l]) => `<div>${s.ui(n, 30)}${l}</div>`).join('')}</div><h4>Reward badges · 7 earned, 16 locked</h4><div class="grid">${Object.keys(B).map((c) => `<div>${s.badge(c, EARNED.has(c))}${B[c][4]}</div>`).join('')}</div></div>`;
document.getElementById('out').innerHTML = panel('light') + panel('dark');
</script></body></html>
