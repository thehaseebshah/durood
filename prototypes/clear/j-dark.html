<!doctype html><html><head><meta charset="utf-8"><title>J · Dark Focus</title><script src="common.js"></script><script src="ui.js"></script>
<style>
:root{--bg:#0c0d0f;--card:#16181b;--ink:#f2efe8;--soft:#8b8d92;--gold:#e8c46a;--line:#25282c}
*{box-sizing:border-box;margin:0}body{background:var(--bg);color:var(--ink);font:14px 'Inter',system-ui,sans-serif;padding:20px 20px 90px;user-select:none}
html[lang=ur] body{font-family:'Noto Nastaliq Urdu','Noto Naskh Arabic',serif;line-height:1.7}
.top{display:flex;justify-content:space-between;font-size:.8rem;color:var(--soft)}
.hero{margin-top:22px;display:flex;align-items:flex-end;justify-content:space-between}
.n{font-size:5.6rem;font-weight:100;letter-spacing:-4px;line-height:.95;font-variant-numeric:tabular-nums}.hero small{color:var(--soft);display:block;font-size:.82rem;margin-bottom:4px}
.pill{margin-top:20px;display:flex;align-items:center;justify-content:space-between;background:var(--gold);color:#241a00;border-radius:999px;padding:6px 6px 6px 24px;font-weight:700;font-size:1.05rem;cursor:pointer}html[dir=rtl] .pill{padding:6px 24px 6px 6px}
.pill span.k{background:#241a00;color:var(--gold);width:48px;height:48px;border-radius:50%;display:grid;place-items:center;font-size:1.1rem}
.bar{height:3px;background:var(--line);margin-top:20px;position:relative}.bar i{position:absolute;inset:0 auto 0 0;background:var(--gold)}html[dir=rtl] .bar i{inset:0 0 0 auto}
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:16px}.grid div{background:var(--card);border-radius:14px;padding:12px}.grid b{display:block;font-size:1.15rem;font-weight:500;font-variant-numeric:tabular-nums}.grid span{font-size:.7rem;color:var(--soft)}
h3{margin:24px 0 6px;font-size:.75rem;text-transform:uppercase;letter-spacing:1.2px;color:var(--soft)}html[lang=ur] h3{text-transform:none;letter-spacing:0;font-size:.95rem}
.q{display:flex;align-items:center;gap:12px;padding:12px 0;border-top:1px solid var(--line)}.q .ck{width:18px;height:18px;border-radius:5px;border:1.5px solid var(--soft);flex:none;display:grid;place-items:center;font-size:.7rem}.q.d .ck{background:var(--gold);border-color:var(--gold);color:#241a00}
.q .t{flex:1}.q .t small{display:block;color:var(--soft);font-variant-numeric:tabular-nums}.q .p{color:var(--gold);font-weight:600}.q.bonus{opacity:.5}.q.bonus .p{color:var(--soft)}
.car{display:flex;gap:6px}.car i{flex:1;aspect-ratio:1;border-radius:50%;background:var(--card);border:1px solid var(--line)}.car i.on{background:var(--ink);border-color:var(--ink)}.carm{display:flex;justify-content:space-between;margin-top:10px;font-size:.85rem;color:var(--soft)}.carm b{color:var(--ink);font-weight:500}
.nav{position:fixed;inset:auto 0 0;background:var(--bg);border-top:1px solid var(--line);display:flex}.nav span{flex:1;text-align:center;padding:10px 0 12px;color:var(--soft);font-size:.7rem}.nav span svg{display:block;margin:0 auto 2px}.nav em{font-style:normal}.nav .on{color:var(--gold);font-weight:700}
</style></head><body>
<div class="top"><span id="app"></span><span id="st"></span></div>
<div class="hero"><div><small id="cap"></small><div class="n" id="n"></div></div><b id="gl" style="color:var(--soft);font-weight:400"></b></div>
<div class="bar"><i id="bar"></i></div>
<div class="pill" id="pill"><span id="pt"></span><span class="k" id="pk"></span></div>
<div class="grid"><div><b id="s1"></b><span id="s1l"></span></div><div><b id="s2"></b><span id="s2l"></span></div><div><b id="s3"></b><span id="s3l"></span></div></div>
<h3 id="h1"></h3><div id="dq"></div><h3 id="h2"></h3><div id="bq"></div>
<h3 id="h3"></h3><div class="car" id="car"></div><div class="carm"><span id="cm"></span><b id="ct"></b></div>
<div id="nav"></div>
<script>
const $=(i)=>document.getElementById(i);let c=qs(DATA.today);
$('app').textContent=t('app');$('st').textContent=DATA.streak+' '+t('streak');$('cap').textContent=t('durood')+' · '+t('today');$('gl').textContent=t('goalword')+' '+ltr(fmt(DATA.goal));$('pt').textContent=t('tap');$('pk').textContent=ltr('+1');
$('s1').textContent=fmt(DATA.week);$('s1l').textContent=t('week');$('s2').textContent='#'+DATA.rank;$('s2l').textContent=t('rankw');$('s3').textContent=fmt(DATA.total);$('s3l').textContent=t('total');
const row=(q,b)=>`<div class="q ${q[1]>=q[2]?'d':''} ${b?'bonus':''}"><span class="ck">${q[1]>=q[2]?'✓':''}</span><span class="t">${t(q[0])}<small>${ltr(fmt(q[1])+' / '+fmt(q[2]))}</small></span><span class="p">${ltr('+'+q[3])}</span></div>`;
$('h1').textContent=t('dq');$('dq').innerHTML=Q.durood.map((q)=>row(q)).join('');$('h2').textContent=t('bq');$('bq').innerHTML=Q.bonus.map((q)=>row(q,1)).join('');
$('h3').textContent=t('caravan');$('car').innerHTML=[...Array(DATA.members)].map((_,i)=>`<i class="${i<DATA.lit?'on':''}"></i>`).join('');$('cm').textContent=ltr(DATA.lit+' / '+DATA.members)+' '+t('lit');$('ct').textContent=fmt(DATA.caravanTotal);
$('nav').innerHTML=navHTML();
function draw(){$('n').textContent=fmt(c);$('bar').style.width=Math.min(100,c/DATA.goal*100)+'%'}
$('pill').onclick=()=>{c++;draw()};draw();
</script></body></html>
