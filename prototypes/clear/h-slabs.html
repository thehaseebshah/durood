<!doctype html><html><head><meta charset="utf-8"><title>H · Slabs</title><script src="common.js"></script><script src="ui.js"></script>
<style>
:root{--bg:#eceae4;--ink:#171717;--g:#0e6b4f;--a:#d99a2b;--b:#5b6b7a;--soft:#77766f}
*{box-sizing:border-box;margin:0}body{background:var(--bg);color:var(--ink);font:14px 'Inter',system-ui,sans-serif;padding:20px 20px 90px;user-select:none}
html[lang=ur] body{font-family:'Noto Nastaliq Urdu','Noto Naskh Arabic',serif;line-height:1.7}
.top{display:flex;justify-content:space-between;font-size:.8rem;color:var(--soft)}
.slab{position:relative;overflow:hidden;background:rgba(0,0,0,.07);margin-top:12px;display:flex;align-items:flex-end;justify-content:space-between;padding:14px 16px}
.slab .fill{position:absolute;inset:0 auto 0 0;transition:width .2s}html[dir=rtl] .slab .fill{inset:0 0 0 auto}
.slab>*{position:relative}.slab small{display:block;font-size:.72rem;opacity:.8}.slab b{font-size:1.1rem}
.d{height:190px;margin-top:16px}.d .fill{background:var(--g)}.d{color:#fff}.d .n{font-size:5rem;font-weight:200;letter-spacing:-3px;line-height:1;font-variant-numeric:tabular-nums}
.d .tapb{align-self:flex-start;position:absolute;inset:14px 16px auto auto;background:#fff;color:var(--g);font-weight:700;border-radius:999px;padding:8px 18px;cursor:pointer}html[dir=rtl] .d .tapb{inset:14px auto auto 16px}
.s{height:86px}.s .fill{background:var(--a);width:0}.t{height:78px}.t .fill{background:var(--b);width:0}
.s b,.t b{font-variant-numeric:tabular-nums}
.stats{display:flex;justify-content:space-between;margin-top:14px;font-size:.85rem}.stats b{font-size:1.15rem;display:block;font-variant-numeric:tabular-nums}.stats span{color:var(--soft);font-size:.72rem}
h3{margin:22px 0 6px;font-size:.78rem;text-transform:uppercase;letter-spacing:1.2px;color:var(--soft)}html[lang=ur] h3{text-transform:none;letter-spacing:0;font-size:.95rem}
.q{display:flex;justify-content:space-between;padding:11px 0;border-top:1px solid #cfcdc6}.q small{display:block;color:var(--soft)}.q.d2 span:first-child{text-decoration:line-through;opacity:.55}
.car{display:flex;gap:4px}.car i{flex:1;height:8px;background:#cfcdc6}.car i.on{background:var(--ink)}
.nav{position:fixed;inset:auto 0 0;background:var(--bg);border-top:1px solid #cfcdc6;display:flex}.nav span{flex:1;text-align:center;padding:10px 0 12px;color:var(--soft);font-size:.7rem}.nav span svg{display:block;margin:0 auto 2px}.nav em{font-style:normal}.nav .on{color:var(--g);font-weight:700}
</style></head><body>
<div class="top"><span id="app"></span><span id="st"></span></div>
<div class="slab d"><div class="fill" id="fd"></div><span class="tapb" id="tap"></span><div><small id="dl"></small><div class="n" id="n"></div></div><b id="dg"></b></div>
<div class="slab s"><div class="fill"></div><div><b id="sn"></b><small id="sd"></small></div><b>⁦0 / 1⁩</b></div>
<div class="slab t"><div class="fill"></div><div><b id="se"></b><small id="sed"></small></div><b>⁦0 / 1⁩</b></div>
<div class="stats"><div><b id="s1"></b><span id="s1l"></span></div><div><b id="s2"></b><span id="s2l"></span></div><div><b id="s3"></b><span id="s3l"></span></div></div>
<h3 id="h1"></h3><div id="dq"></div><h3 id="h3"></h3><div class="car" id="car"></div>
<div id="nav"></div>
<script>
const $=(i)=>document.getElementById(i);let c=qs(DATA.today);
$('app').textContent=t('app');$('st').textContent=DATA.streak+' '+t('streak');$('dl').textContent=t('durood')+' · '+t('today');$('tap').textContent=ltr('+1')+' '+t('recite');$('dg').textContent=ltr(fmt(DATA.goal));
$('sn').textContent=t('sunnah');$('sd').textContent=t('q_sunnah');$('se').textContent=t('seerah');$('sed').textContent=t('q_lecture');
$('s1').textContent=fmt(DATA.week);$('s1l').textContent=t('week');$('s2').textContent='#'+DATA.rank;$('s2l').textContent=t('rankw');$('s3').textContent=fmt(DATA.total);$('s3l').textContent=t('total');
$('h1').textContent=t('dq');$('dq').innerHTML=Q.durood.map((q)=>`<div class="q ${q[1]>=q[2]?'d2':''}"><span>${t(q[0])}<small>${ltr(fmt(q[1])+' / '+fmt(q[2]))}</small></span><b>${ltr('+'+q[3])}</b></div>`).join('');
$('h3').textContent=t('caravan')+' · '+ltr(DATA.lit+' / '+DATA.members);$('car').innerHTML=[...Array(DATA.members)].map((_,i)=>`<i class="${i<DATA.lit?'on':''}"></i>`).join('');
$('nav').innerHTML=navHTML();
function draw(){$('n').textContent=fmt(c);$('fd').style.width=Math.min(100,c/DATA.goal*100)+'%'}
$('tap').onclick=()=>{c++;draw()};draw();
</script></body></html>
