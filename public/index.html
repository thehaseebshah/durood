  <meta property="og:type" content="website">

  <meta property="og:url" content="%ORIGIN%/">

  <link rel="apple-touch-icon" href="/icons/icon-192.png">
  <link rel="preload" href="/fonts/inter-latin.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="stylesheet" href="/style.css">
  <!-- the app's three modules download together, not one after another (slow mobile data pays a full round trip per step) -->
  <link rel="modulepreload" href="/app.js">
  <link rel="modulepreload" href="/i18n.js">
  <link rel="modulepreload" href="/icons.js">
</head>
<body>
  <script>
    /* white / dark choice: saved choice wins, otherwise follow the phone's setting; set before paint to avoid a flash */
    (function () {
      var m = null, signedIn = false;
      try { m = localStorage.getItem('mode'); signedIn = !!localStorage.getItem('token'); } catch (e) {}
      if (m !== 'dark' && m !== 'light') m = matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
      document.documentElement.setAttribute('data-mode', m);
      /* the phone's bar starts in the colour the app will show (a member's light or dark header), not the welcome screen's navy */
      if (signedIn) document.querySelector('meta[name=theme-color]').setAttribute('content', m === 'dark' ? '#1c1c1e' : '#f6f6f8');
    })();
  </script>
  <div id="app"><div class="boot" role="status"><b>Durood Quest</b><span>درود کوئسٹ</span></div></div>
  <div id="toast" role="status" aria-live="polite"></div>
  <script type="module" src="/app.js"></script>
</body>
</html>
