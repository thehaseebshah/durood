<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0b6b4a">
  <title>Durood Qafila</title>
  <link rel="manifest" href="/manifest.webmanifest">
  <link rel="icon" href="/icons/icon-192.png">
  <link rel="apple-touch-icon" href="/icons/icon-192.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@200;300;400;500;600;700;800&family=Noto+Naskh+Arabic:wght@400;700&family=Noto+Nastaliq+Urdu:wght@400;700&display=swap">
  <link rel="stylesheet" href="/style.css">
</head>
<body>
  <script>
    /* design review only: ?theme=signal|board|calm|geometry|dark loads an alternative stylesheet */
    (function () {
      var t = new URLSearchParams(location.search).get('theme');
      if (t && /^[a-z]+$/.test(t)) document.head.insertAdjacentHTML('beforeend', '<link rel="stylesheet" href="/themes/' + t + '.css">');
    })();
  </script>
  <div id="app"></div>
  <div id="toast" role="status" aria-live="polite"></div>
  <script type="module" src="/app.js"></script>
</body>
</html>
