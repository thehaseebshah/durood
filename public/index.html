<body>
  <script>
    /* white / dark choice: saved choice wins, otherwise follow the phone's setting; set before paint to avoid a flash */
    (function () {
      var m = null;
      try { m = localStorage.getItem('mode'); } catch (e) {}
      if (m !== 'dark' && m !== 'light') m = matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
      document.documentElement.setAttribute('data-mode', m);
    })();
  </script>
  <div id="app"></div>
  <div id="toast" role="status" aria-live="polite"></div>
  <script type="module" src="/app.js"></script>
</body>
