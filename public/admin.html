<!doctype html>
<html lang="en" dir="ltr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex">
  <title>Admin · Seerah Quest</title>
  <link rel="stylesheet" href="/style.css">
  <script>
    (function () {
      var m = null; try { m = localStorage.getItem('mode'); } catch (e) {}
      if (m !== 'dark' && m !== 'light') m = matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
      document.documentElement.setAttribute('data-mode', m);
    })();
  </script>
  <style>
    body { padding-bottom: 40px; } .wrap { max-width: 880px; }
    .bar2 { display: flex; gap: 8px; align-items: center; padding: 12px 20px; border-bottom: 1px solid var(--line); flex-wrap: wrap; }
    .bar2 input { flex: 1; min-width: 180px; }
    /* signed out: the sign-in fields are a centred card, not a strip across the page */
    body.out .bar2 { flex-direction: column; align-items: stretch; max-width: 360px; margin: 12vh auto 0; padding: 28px 24px 20px; background: var(--paper); border: 0; border-radius: 18px; box-shadow: var(--shadow); gap: 10px; }
    body.out .bar2::before { content: "Sign in"; font-size: 1.5rem; font-weight: 800; letter-spacing: -.5px; margin-bottom: 4px; }
    body.out .bar2 input { min-width: 0; min-height: 46px; }
    body.out .bar2 .chip { min-height: 44px; justify-content: center; }
    body.out #panel .empty { max-width: 360px; margin-inline: auto; }
    body.out #tabs { display: none; }
    body.out #usekey, body.out #back { background: none; color: var(--accent); font-weight: 600; }
    /* every field on the admin page looks like one, whatever its type (date, url, untyped text, text areas) */
    #panel input:not([type=checkbox]):not([type=radio]):not([type=hidden]), #panel textarea, #panel select { width: 100%; box-sizing: border-box; font: inherit; padding: 10px; border: 1px solid var(--line); border-radius: 10px; border-radius: 0; background: var(--cell); color: var(--ink); }
    #panel textarea { resize: vertical; }
    [hidden] { display: none !important; }
    .amenu summary { cursor: pointer; font-weight: 700; padding: 8px 12px; border: 1.5px solid var(--ink); display: inline-block; list-style: none; }
    .amenu summary::-webkit-details-marker { display: none; }
    .amenu summary::after { content: ' ▾'; }
    .amenu[open] > div { display: flex; flex-direction: column; gap: 6px; margin-top: 6px; }
    .amenu [data-a=memdel] { color: var(--err); border-color: var(--err); }
    .tabs2 { display: flex; flex-wrap: wrap; border-bottom: 1px solid var(--line); }
    .tabs2 button { background: none; border: 0; padding: 12px 10px; flex: 1 0 auto; font-weight: 700; color: var(--soft); border-bottom: 4px solid transparent; white-space: nowrap; }
    .tabs2 button.on { color: var(--ink); border-bottom-color: var(--sig); }
    .panel { padding: 0 20px 20px; }
    .panel h3 { margin-inline: -20px; }
    table { width: 100%; border-collapse: collapse; font-size: .84rem; margin-top: 8px; }
    th { text-align: start; font-size: .68rem; text-transform: uppercase; letter-spacing: 1px; color: var(--soft); padding: 6px 8px; border-bottom: 2px solid var(--ink); }
    td { padding: 8px; border-bottom: 1px solid var(--line); vertical-align: top; }
    td .row { flex-wrap: wrap; }
    .code2 { font: 800 1.15rem Inter, monospace; letter-spacing: 1px; }
    .pillbox { display: inline-block; font-size: .68rem; font-weight: 700; border: 1.5px solid var(--ink); padding: 0 6px; margin-inline-end: 4px; }
    .pillbox.bad { border-color: var(--err); color: var(--err); } .pillbox.ok { border-color: var(--sig); color: var(--sig-text); }
    .inline { display: flex; gap: 8px; margin: 10px 0; flex-wrap: wrap; align-items: end; } .inline label { margin: 0 0 3px; } .inline > div { flex: 1; min-width: 140px; }
    label.check { display: inline-flex; align-items: center; gap: 8px; min-height: 44px; }
    .msg { margin: 10px 0; padding: 10px 12px; background: var(--sig-bg); border-inline-start: 4px solid var(--sig); font-weight: 600; overflow-wrap: anywhere; }
    .empty { color: var(--soft); padding: 14px 0; }
    .chip { margin: 2px 4px 2px 0; }
      .wrap { border-inline: 0; }
    .hd { border-bottom: .5px solid var(--line) !important; background: var(--glass); backdrop-filter: saturate(180%) blur(20px); -webkit-backdrop-filter: saturate(180%) blur(20px); position: sticky; top: 0; z-index: 5; }
    #panel table { background: var(--paper); border-radius: 14px; overflow: hidden; box-shadow: var(--shadow); }
  </style>
</head>
<body>
<div class="hd"><span>Admin · Seerah Quest</span><span class="row"><button class="pill" id="mode">☾ / ☀</button><a class="pill" href="/" style="text-decoration:none">← App</a></span></div>
<div class="wrap">
  <div class="bar2" id="bar"></div>
  <div id="audit"></div>
  <div class="tabs2" id="tabs"></div>
  <div class="panel" id="panel"></div>
</div>
<script type="module" src="/admin.js"></script>
</body>
</html>
